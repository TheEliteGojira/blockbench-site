<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 · Signal Lost · KAYGEE.MDL</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/blockbench-site/assets/favicon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#0a1622" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  :root{
    --base:#0a1622; --panel:#0c1e30; --accent:#33a9f2; --hi:#6ec9ff;
    --ink:#bcd4e8; --green:#3fd07f; --chamf:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--base); color:var(--ink);
    font-family:"Share Tech Mono",ui-monospace,monospace;
    min-height:100vh; display:grid; place-items:center; padding:24px;
    position:relative; overflow:hidden;
  }
  /* scanlines */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(51,169,242,.05) 0 1px,transparent 1px 4px);
  }
  .panel{
    position:relative; max-width:560px; width:100%; text-align:center;
    background:linear-gradient(180deg,rgba(12,30,48,.95),rgba(10,22,34,.95));
    border:1px solid rgba(51,169,242,.35);
    clip-path:polygon(var(--chamf) 0,100% 0,100% calc(100% - var(--chamf)),calc(100% - var(--chamf)) 100%,0 100%,0 var(--chamf));
    padding:48px 40px 44px;
  }
  .bracket{position:absolute;width:20px;height:20px;border:2px solid var(--accent)}
  .tl{top:8px;left:8px;border-right:0;border-bottom:0}
  .tr{top:8px;right:8px;border-left:0;border-bottom:0}
  .bl{bottom:8px;left:8px;border-right:0;border-top:0}
  .br{bottom:8px;right:8px;border-left:0;border-top:0}
  .eyebrow{
    font-family:"Orbitron",sans-serif; font-weight:700; letter-spacing:.28em;
    font-size:.72rem; color:var(--accent); text-transform:uppercase; margin-bottom:14px;
  }
  .code{
    font-family:"Bebas Neue",sans-serif; line-height:.85; letter-spacing:.04em;
    font-size:clamp(96px,26vw,168px);
    background:linear-gradient(180deg,var(--hi),var(--accent));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  h1{
    font-family:"Orbitron",sans-serif; font-weight:700; font-size:1.15rem;
    letter-spacing:.06em; color:#eaf4ff; margin:6px 0 12px;
  }
  p{font-size:.95rem; line-height:1.6; color:var(--ink); margin-bottom:28px}
  .btn{
    display:inline-block; font-family:"Orbitron",sans-serif; font-weight:700;
    letter-spacing:.12em; font-size:.8rem; text-transform:uppercase; text-decoration:none;
    color:var(--base); background:var(--accent); padding:13px 26px;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    transition:background .15s ease;
  }
  .btn:hover{background:var(--hi)}
  .status{
    margin-top:26px; font-size:.72rem; letter-spacing:.16em; color:var(--green);
    text-transform:uppercase; display:flex; gap:8px; align-items:center; justify-content:center;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  @media (prefers-reduced-motion:no-preference){
    .dot{animation:pulse 1.8s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.35}}
  }
</style>
</head>
<body>
  <main class="panel">
    <span class="bracket tl"></span><span class="bracket tr"></span>
    <span class="bracket bl"></span><span class="bracket br"></span>
    <div class="eyebrow">// Signal Lost</div>
    <div class="code">404</div>
    <h1>This model isn't on the rack</h1>
    <p>The page you're after doesn't exist, moved, or was never exported. Head back to the workshop and pick a piece from the gallery.</p>
    <a class="btn" href="/blockbench-site/">Return to base</a>
    <div class="status"><span class="dot"></span> Comms Open</div>
  </main>
</body>
</html>
